disabled_rules:
  - trailing_whitespace
  - type_name
  - identifier_name
  - large_tuple
  - force_try
  - line_length
  - type_body_length
  - function_body_length
  - cyclomatic_complexity
  - file_length
  - shorthand_operator
  # Opinionated / non-autofixable rules relaxed to match the project's style.
  - trailing_comma
  - inclusive_language
  - function_parameter_count
  - nesting
  - todo
  - implicit_optional_initialization
  - non_optional_string_data_conversion
  - for_where
  - closure_parameter_position
  - multiple_closures_with_trailing_closure
  - unused_optional_binding
  # SwiftFormat owns brace placement (wrapMultilineStatementBraces); disable to avoid the conflict.
  - opening_brace

excluded:
  - .build
  - DerivedData
  - build
  - iOS/build
  - macOS/build
  - Modules/**/.build
  # Vendored streaming SDKs (maintained as separate submodules).
  - Packages

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - fatal_error_message
